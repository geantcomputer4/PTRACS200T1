services:
  traccar:
    image: traccar/traccar:latest
    restart: always
    ports:
      - "5013:5013"
      - "5013:5013/udp"
    environment:
      - CONFIG_USE_ENVIRONMENT_VARIABLES=true
      - FILTER_ENABLE=true
      - FILTER_INVALID=true
      - FILTER_ZERO=true
      - FILTER_DUPLICATE=true
      - GEOCODER_ENABLE=true
      - GEOCODER_TYPE=nominatim
      - EVENT_FORWARD_ENABLE=true
      - EVENT_FORWARD_URL=http://notifier:3000/event
      - EVENT_FORWARD_JSON=true
      - EVENT_MOTION_SPEEDTHRESHOLD=1.5
      - GEOLOCATION_ENABLE=true
      - GEOLOCATION_TYPE=opencellid
      - GEOLOCATION_KEY=${OPENCELLID_KEY}
      - GEOLOCATION_PROCESSINVALIDPOSITIONS=true
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  notifier:
    build: ./notifier
    restart: always
    depends_on:
      - traccar
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    volumes:
      - notifier-data:/data

  web:
    build: ./web
    restart: always
    depends_on:
      - traccar
    environment:
      - SERVICE_FQDN_WEB_80

volumes:
  traccar-data:
  traccar-logs:
  notifier-data:
