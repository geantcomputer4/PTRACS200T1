services:
  traccar:
    image: traccar/traccar:latest
    restart: always
    ports:
      - "5013:5013"
      - "5013:5013/udp"
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  web:
    build: ./web
    restart: always
    depends_on:
      - traccar
    environment:
      - SERVICE_FQDN_WEB_80

volumes:
  traccar-data:
  traccar-logs:
